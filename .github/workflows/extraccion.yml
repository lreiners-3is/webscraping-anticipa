name: Extracción

# Se ejecuta a las 7:00, 13:00 y 19:00 en Colombia (UTC-5), y también a mano.
on:
  schedule:
    - cron: "0 0,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos corridas a la vez sobre la misma carpeta de Drive.
concurrency:
  group: extraccion
  cancel-in-progress: false

env:
  REMOTO: "drive:Anticipa Webscrapping/OUTPUT"
  CARPETA_LOCAL: /home/runner/output

jobs:
  extraer:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # actions/checkout v4.2.2, fijado a una versión exacta
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Instalar dependencias
        run: |
          # rclone con versión y firma fijas
          curl -fsSL -o rclone.zip https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.zip
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  rclone.zip" | sha256sum -c -
          unzip -q -j rclone.zip '*/rclone' -d rclone-bin
          sudo install -m 755 rclone-bin/rclone /usr/local/bin/rclone
          rm -rf rclone.zip rclone-bin
          rclone version | head -1
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt

      - name: Configurar acceso a Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" | tr -d '\r' > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      # Se trabaja sobre una copia local: el historial, las huellas y los
      # archivos existentes vienen de Drive.
      - name: Traer OUTPUT desde Drive
        id: traer
        run: |
          mkdir -p "$CARPETA_LOCAL"
          rclone mkdir "$REMOTO"
          rclone copy "$REMOTO" "$CARPETA_LOCAL" --checksum --stats 1m --stats-one-line

      - name: Ejecutar la extracción
        env:
          OUTPUT_WEBSCRAPING: ${{ env.CARPETA_LOCAL }}
        run: .venv/bin/python scripts/ejecutar_notebook.py

      # Sube también si un módulo falló, para no perder lo de los demás.
      # Solo sube lo que cambió. Si Drive no recibe algo, el paso da error.
      # --max-delete evita un borrado masivo si algo sale mal.
      - name: Sincronizar con Drive
        if: always() && steps.traer.outcome == 'success'
        run: |
          rclone sync "$CARPETA_LOCAL" "$REMOTO" --checksum --max-delete 100 \
            --exclude "*.part" --exclude "*.tmp" --stats 1m --stats-one-line
          echo "Sincronización con Drive completa"
